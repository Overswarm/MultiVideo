<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; overflow: hidden; }
  body, html { width: 100%; height: 100%; background: #000; visibility: visible !important; }
  #player { width: 100%; height: 100%; visibility: visible !important; }
  #player iframe { width: 100% !important; height: 100% !important; border: 0 !important; visibility: visible !important; }
</style>
</head>
<body>
<div id="player"></div>
<script src="https://player.twitch.tv/js/embed/v1.js"></script>
<script>
(function() {
  var params = new URLSearchParams(location.search);
  var type   = params.get('type');
  var value  = params.get('value');
  var time   = params.get('time') || '';
  var auto   = params.get('autoplay') !== 'false';
  var host   = location.hostname || 'localhost';

  var player           = null;
  var ready            = false;
  var pending          = [];
  var intendedPlaying  = auto;
  var retryCount       = 0;
  var maxRetries       = 6;
  var retryTimer       = null;

  function exec(cmd) {
    if (!player) return;
    switch (cmd) {
      case 'play':
        intendedPlaying = true;
        retryCount = 0;
        try { player.play(); } catch (e) {}
        break;
      case 'pause':
        intendedPlaying = false;
        if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
        try { player.pause(); } catch (e) {}
        break;
      case 'mute':   try { player.setMuted(true);  } catch (e) {} break;
      case 'unmute': try { player.setMuted(false); } catch (e) {} break;
    }
  }

  function scheduleRetry() {
    if (!intendedPlaying || retryCount >= maxRetries) return;
    if (retryTimer) clearTimeout(retryTimer);
    // Randomised back-off so multiple wrappers don't all retry at the
    // same instant (and re-trigger Twitch's "only one player" coordination)
    var delay = 300 + retryCount * 400 + Math.random() * 600;
    retryTimer = setTimeout(function() {
      retryTimer = null;
      retryCount++;
      try { player.play(); } catch (e) {}
    }, delay);
  }

  if (type === 'clip') {
    // Clips are not supported by the Twitch Player SDK — use raw embed
    var f = document.createElement('iframe');
    f.src = 'https://clips.twitch.tv/embed?clip=' + value +
            '&parent=' + host + '&autoplay=' + auto + '&muted=true';
    f.allow = 'autoplay; encrypted-media; fullscreen';
    f.allowFullscreen = true;
    f.style.cssText = 'width:100%;height:100%;border:0';
    document.getElementById('player').appendChild(f);
    ready = true;
    window.parent.postMessage({ mvReady: true }, '*');
  } else {
    var opts = {
      parent:   [host],
      autoplay: auto,
      muted:    true,
      width:    '100%',
      height:   '100%',
    };
    if (type === 'channel') opts.channel = value;
    else { opts.video = value; if (time) opts.time = time; }

    player = new Twitch.Player('player', opts);

    player.addEventListener(Twitch.Player.READY, function() {
      ready = true;
      for (var i = 0; i < pending.length; i++) exec(pending[i]);
      pending = [];
      window.parent.postMessage({ mvReady: true }, '*');
    });

    // When Twitch unilaterally pauses us (e.g. because another embed on
    // the page started playing), retry play() with back-off — but only
    // if the user actually wants this player to be playing.
    player.addEventListener(Twitch.Player.PAUSE, function() {
      if (intendedPlaying) scheduleRetry();
    });

    player.addEventListener(Twitch.Player.PLAY, function() {
      retryCount = 0;
    });
  }

  window.addEventListener('message', function(e) {
    if (!e.data || !e.data.mvCmd) return;
    if (ready) exec(e.data.mvCmd);
    else pending.push(e.data.mvCmd);
  });
})();
</script>
</body>
</html>
